<!doctype html>
<html lang="{{ config.default_language }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  {# Loaded in <head> (not deferred) so the saved theme applies before first paint. #}
  <script src="{{ get_url(path='js/theme.js', cachebust=true) }}"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ config.base_url }}/">{{ config.title }}</a>
    <nav class="site-nav">
      <a href="{{ get_url(path='@/posts/_index.md') }}">Posts</a>
      <a href="{{ config.base_url }}/tags/">Tags</a>
      <a href="{{ config.extra.github }}">GitHub</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme">Light</button>
    </nav>
  </header>

  <main class="{% block main_class %}container{% endblock main_class %}">
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ config.extra.author }}</span>
    <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}">Feed</a>
  </footer>
  {% block scripts %}{% endblock scripts %}
</body>
</html>
