{% extends "base.html" %}

{% block content %}
{% set posts = get_section(path="posts/_index.md") %}
<section class="intro">
  <h1>{{ config.title }}</h1>
  <p class="tagline">{{ config.extra.tagline }}</p>
</section>

<h2>Latest posts</h2>
{{<post_list pages={posts.pages[:10]} />}}
{% if posts.pages | length > 10 %}
<p><a href="{{ posts.permalink }}">All posts &rarr;</a></p>
{% endif %}
{% endblock content %}
